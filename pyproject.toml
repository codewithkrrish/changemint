[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "changemint"
version = "1.0.0"
description = "Turn a git log into a clean, grouped CHANGELOG.md — conventional-commit aware, zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Krrish", email = "codewithkrrish7@gmail.com" }]
keywords = ["changelog", "git", "conventional-commits", "release-notes", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/codewithkrrish/changemint"

[project.scripts]
changemint = "changemint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
